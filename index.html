<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Trading Diary</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* dark first: a diary read on a phone, often at night */
  :root {
    --bg: #111418; --card: #1a1f26; --fg: #e8eaee; --muted: #8a93a3; --line: #262c36;
    --win: #2fbf71; --win-bg: #15382a; --loss: #e5484d; --loss-bg: #3d1d20; --flat: #2a313c;
    --accent: #f0b432;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    font-variant-numeric: tabular-nums;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 4px; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .meta { color: var(--muted); font-size: 12px; }
  .total { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 10px; }
  .total .n { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .total .n.win { color: var(--win); } .total .n.loss { color: var(--loss); }
  .total .l { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
  nav button {
    flex: 1; background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 0; font: inherit; font-weight: 600; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--accent); color: #141414; border-color: var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding-bottom: 20px; }
  .grid.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .card { border-radius: 8px; padding: 6px 5px 5px; min-width: 0; display: flex; flex-direction: column; gap: 1px; border: 1px solid transparent; text-align: center; }
  .card.win { background: var(--win-bg); border-color: #1f5a3c; }
  .card.loss { background: var(--loss-bg); border-color: #6b2a2e; }
  .card.flat { background: var(--flat); color: var(--muted); }
  .card .d { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.win .d, .card.loss .d { color: inherit; opacity: .8; }
  .card .n { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid.wide .card .n { font-size: 14px; }
  .card.win .n { color: var(--win); } .card.loss .n { color: var(--loss); }
  .card .t { font-size: 9px; color: var(--muted); }
  .card.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .months { display: flex; justify-content: space-between; padding: 0 0 8px; }
  .months button { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 2px 0; }
  .months button:disabled { color: var(--line); cursor: default; }
  .install { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 6px 0 10px; font-size: 13px; }
  .setup { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .setup label { font-size: 13px; color: var(--muted); }
  .setup input { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 8px; }
  .btn { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: #141414; border-color: var(--accent); }
  .status { color: var(--muted); font-size: 12px; padding: 8px 0 16px; display: flex; justify-content: space-between; gap: 8px; }
  .status button { background: none; border: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .next { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; margin: 0 0 10px; font-size: 13px; min-width: 0; }
  .next .when { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .next.soon { border-color: var(--accent); }
  .next.now { border-color: var(--loss); } .next.now .when { color: var(--loss); }
  .next .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list { display: flex; flex-direction: column; gap: 4px; padding-bottom: 20px; }
  .list h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 10px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
  .ev { display: grid; grid-template-columns: 40px 38px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  .ev .tm { font-weight: 700; font-size: 13px; }
  .ev .cc { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 1px 0; }
  .ev .cc.usd { color: var(--accent); border-color: var(--accent); }
  .ev .cc.med { border-style: dashed; opacity: .75; }
  .ev .ti { min-width: 0; display: flex; flex-direction: column; }
  .ev .ti .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .ti .fp { font-size: 11px; color: var(--muted); }
  .ev .in { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ev.soon { border-color: var(--accent); } .ev.soon .in { color: var(--accent); font-weight: 700; }
  .ev.done { opacity: .55; }
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 2px 0 6px; }
  .tools button { background: var(--card); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .tools button.on { background: var(--accent); color: #141414; border-color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .card { transition: transform .12s ease; } .card:active { transform: scale(.97); } }
</style>
</head>
<body>
<header>
  <h1>Trading Diary</h1>
  <span class="meta" id="account"></span>
</header>

<section class="setup" id="setup" hidden>
  <label for="gist">Paste the id of the diary gist the PC writes to (the long code at the end of its link). It is kept on this phone only.</label>
  <div class="row">
    <input id="gist" placeholder="e.g. 7f3c9a2b1d…" autocomplete="off" spellcheck="false" style="flex:1">
    <button class="btn primary" id="save">Save</button>
  </div>
</section>

<div class="install" id="install" hidden>
  <span>Install the diary as an app on this phone.</span>
  <button class="btn primary" id="install-btn">Install</button>
</div>

<div class="total">
  <span class="n" id="total">—</span>
  <span class="l" id="total-label">loading…</span>
</div>

<div class="next" id="next-news" hidden><span class="when" id="next-when"></span><span class="what" id="next-what"></span></div>
<nav role="tablist">
  <button role="tab" id="tab-day" aria-selected="true">Daily</button>
  <button role="tab" id="tab-week" aria-selected="false">Weekly</button>
  <button role="tab" id="tab-month" aria-selected="false">Monthly</button>
  <button role="tab" id="tab-news" aria-selected="false">News</button>
</nav>
<div class="tools" id="news-tools" hidden>
  <span id="news-note">Solid USD = high impact; dashed = medium.</span>
  <button id="alerts-btn" aria-pressed="false">Alerts off</button>
</div>

<div class="months" id="months">
  <button id="prev" aria-label="earlier month">‹ earlier</button>
  <button id="next" aria-label="later month">later ›</button>
</div>
<div class="grid" id="grid"></div>
<div class="list" id="list" hidden></div>

<div class="status">
  <span id="status">Not loaded yet.</span>
  <span><button id="refresh">Refresh</button> · <button id="change">Change gist</button></span>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const VIEWS = ["day", "week", "month", "news"];
  let data = null, view = "day", monthOffset = 0;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  function fmt(n, cur) {
    const sign = n > 0 ? "+" : n < 0 ? "−" : "";
    const whole = Number.isInteger(n);
    return sign + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }) + (cur ? " " + cur : "");
  }
  function ymd(d) { return d.toISOString().slice(0, 10); }
  function addDays(d, n) { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; }
  function today(tz) { return new Date(Date.now() + tz * 3600e3); }  // UTC fields then hold the local date

  function periods(kind) {
    const tz = data.tz_hours || 0;
    const byDay = Object.fromEntries(data.days.map((d) => [d.day, d]));
    const now = today(tz);
    const out = [];
    if (kind === "day") {
      // the days of one month, newest first: the current month up to today, or a whole earlier month
      const first = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + monthOffset, 1));
      const thisMonth = monthOffset === 0;
      const last = thisMonth ? now : new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0));
      for (let d = new Date(last); d >= first; d = addDays(d, -1)) {
        const key = ymd(d), row = byDay[key];
        out.push({ key, label: `${DOW[d.getUTCDay()].slice(0, 2)} ${d.getUTCDate()}`, net: row ? row.net : null, trades: row ? row.trades : 0, isNow: thisMonth && key === ymd(now) });
      }
      out.title = `${MONTHS[first.getUTCMonth()]} ${first.getUTCFullYear()}`;
    } else if (kind === "week") {
      const monday = addDays(now, -((now.getUTCDay() + 6) % 7));
      for (let i = 0; i < 12; i++) {
        const start = addDays(monday, -7 * i), end = addDays(start, 6);
        let net = null, trades = 0;
        for (let k = 0; k < 7; k++) { const row = byDay[ymd(addDays(start, k))]; if (row) { net = (net || 0) + row.net; trades += row.trades; } }
        out.push({ key: ymd(start), label: `${start.getUTCDate()} ${MONTHS[start.getUTCMonth()]} – ${end.getUTCDate()} ${MONTHS[end.getUTCMonth()]}`, net, trades, isNow: i === 0 });
      }
    } else {
      for (let i = 0; i < 12; i++) {
        const m = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - i, 1));
        const prefix = ymd(m).slice(0, 7);
        let net = null, trades = 0;
        for (const row of data.days) if (row.day.startsWith(prefix)) { net = (net || 0) + row.net; trades += row.trades; }
        out.push({ key: prefix, label: `${MONTHS[m.getUTCMonth()]} ${m.getUTCFullYear()}`, net, trades, isNow: i === 0 });
      }
    }
    return out;
  }

  function render() {
    const grid = $("grid");
    grid.innerHTML = "";
    $("list").hidden = view !== "news"; grid.hidden = view === "news"; $("news-tools").hidden = view !== "news";
    $("months").hidden = view !== "day";
    if (!data) { $("total").textContent = "—"; $("total-label").textContent = "nothing loaded yet"; return; }
    renderNext();
    if (view === "news") { renderNews(); return; }
    const cur = data.currency || "";
    const items = periods(view);
    grid.className = "grid" + (view === "day" ? "" : " wide");
    let total = 0, trades = 0;
    for (const it of items) {
      const card = document.createElement("div");
      const cls = it.net === null || Math.abs(it.net) < 0.005 ? "flat" : it.net > 0 ? "win" : "loss";
      card.className = `card ${cls}` + (it.isNow ? " today" : "");
      card.innerHTML = `<span class="d"></span><span class="n"></span><span class="t"></span>`;
      card.querySelector(".d").textContent = it.label;
      card.querySelector(".n").textContent = it.net === null ? "—" : fmt(Math.round(it.net));
      card.querySelector(".t").textContent = it.trades ? `${it.trades} tr` : "—";
      grid.appendChild(card);
      total += it.net || 0; trades += it.trades;
    }
    const t = $("total");
    t.textContent = fmt(total, cur);
    t.className = "n " + (Math.abs(total) < 0.005 ? "" : total > 0 ? "win" : "loss");
    $("total-label").textContent = (view === "day" ? items.title : { week: "last 12 weeks", month: "last 12 months" }[view]) + ` · ${trades} trades`;
    $("next").disabled = monthOffset === 0;
    $("account").textContent = data.account ? `account ${data.account}` : "";
  }

  // ---- news: the PC puts the coming high-impact events into the gist; times are UTC seconds, shown in the phone's zone
  const LEAD = 15 * 60;  // seconds before a release for the alert
  function events() { return (data && Array.isArray(data.news) ? data.news : []).slice().sort((a, b) => a.time - b.time); }
  function hm(t) { return new Date(t * 1000).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); }
  function dayName(t) { const d = new Date(t * 1000); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
  function countdown(t) {
    const s = t - Date.now() / 1000;
    if (s <= 0) return s > -1800 ? "now" : "done";
    const m = Math.round(s / 60);
    if (m < 60) return `in ${m} min`;
    if (m < 48 * 60) return `in ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} m`;
    return `in ${Math.round(m / 1440)} days`;
  }
  function renderNext() {
    const box = $("next-news");
    const next = events().find((e) => e.time > Date.now() / 1000 - 1800);
    if (!next || view === "news") { box.hidden = true; return; }
    const s = next.time - Date.now() / 1000;
    box.hidden = false;
    box.className = "next" + (s <= 0 ? " now" : s <= 3600 ? " soon" : "");
    $("next-when").textContent = countdown(next.time);
    $("next-what").textContent = `${next.country} ${next.title} · ${s < 86400 && s > 0 ? hm(next.time) : dayName(next.time) + " " + hm(next.time)}`;
  }
  function renderNews() {
    const list = $("list");
    list.innerHTML = "";
    const evs = events();
    const now = Date.now() / 1000;
    const next = evs.find((e) => e.time > now - 1800);
    $("total").textContent = next ? countdown(next.time) : "—";
    $("total").className = "n";
    $("total-label").textContent = next ? `${next.country} ${next.title}` : "no high-impact news in the coming days";
    let day = "";
    for (const e of evs) {
      const d = dayName(e.time);
      if (d !== day) { day = d; const h = document.createElement("h2"); h.textContent = d; list.appendChild(h); }
      const row = document.createElement("div");
      const s = e.time - now;
      row.className = "ev" + (s < -1800 ? " done" : s <= 3600 ? " soon" : "");
      row.innerHTML = `<span class="tm"></span><span class="cc"></span><span class="ti"><span class="t"></span><span class="fp"></span></span><span class="in"></span>`;
      row.querySelector(".tm").textContent = hm(e.time);
      const cc = row.querySelector(".cc"); cc.textContent = e.country; if (e.country === "USD") cc.classList.add("usd"); if (e.impact !== "High") cc.classList.add("med");
      row.querySelector(".t").textContent = e.title;
      row.querySelector(".fp").textContent = [e.forecast && `forecast ${e.forecast}`, e.previous && `prev ${e.previous}`].filter(Boolean).join(" · ");
      row.querySelector(".in").textContent = countdown(e.time);
      list.appendChild(row);
    }
    if (!evs.length) { const h = document.createElement("h2"); h.textContent = "nothing scheduled, or the PC has not sent the calendar yet"; list.appendChild(h); }
  }

  // ---- alerts: a phone notification 15 minutes before each event and at the release, while this app is open
  function alertsOn() { return store.get("alerts") === "1" && "Notification" in window && Notification.permission === "granted"; }
  function paintAlerts() {
    const b = $("alerts-btn");
    const on = alertsOn();
    b.textContent = on ? "Alerts on" : "Alerts off";
    b.className = on ? "on" : ""; b.setAttribute("aria-pressed", on ? "true" : "false");
    $("news-note").textContent = on ? "Red ones: 15 min before and at release, while the app is open." : "Solid USD = high impact; dashed = medium.";
  }
  async function notify(title, body, tag) {
    try {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
      if (reg && reg.showNotification) await reg.showNotification(title, { body, tag, icon: "icon-192.png", badge: "icon-192.png", vibrate: [200, 100, 200] });
      else new Notification(title, { body, tag, icon: "icon-192.png" });
    } catch (e) {}
  }
  function checkAlerts() {
    if (!alertsOn()) return;
    const now = Date.now() / 1000;
    let sent = {};
    try { sent = JSON.parse(store.get("notified") || "{}"); } catch (e) {}
    for (const e of events()) {
      if (e.impact !== "High") continue;  // the medium releases are listed, not announced
      for (const [lead, word] of [[LEAD, "in 15 min"], [0, "now"]]) {
        const at = e.time - lead, key = `${e.time}|${e.title}|${lead}`;
        if (now >= at && now < at + 180 && !sent[key]) {
          sent[key] = now;
          notify(`${e.country} news ${word}`, `${e.title} at ${hm(e.time)}` + (e.forecast ? ` · forecast ${e.forecast}` : ""), key);
        }
      }
    }
    for (const k in sent) if (now - sent[k] > 7 * 86400) delete sent[k];
    store.set("notified", JSON.stringify(sent));
  }
  $("alerts-btn").addEventListener("click", async () => {
    if (alertsOn()) { store.set("alerts", "0"); paintAlerts(); return; }
    if (!("Notification" in window)) { $("news-note").textContent = "This browser cannot show notifications."; return; }
    const p = await Notification.requestPermission();
    if (p === "granted") { store.set("alerts", "1"); notify("News alerts on", "You will hear 15 minutes before each high-impact release while the app is open.", "test"); }
    else $("news-note").textContent = "Notifications are blocked for this app in the phone's settings.";
    paintAlerts();
  });
  setInterval(() => { if (!data) return; renderNext(); if (view === "news") renderNews(); checkAlerts(); }, 30000);
  setInterval(() => { if (!document.hidden) load(); }, 10 * 60000);  // the PC updates the gist every five minutes

  async function load() {
    const id = store.get("gist");
    if (!id) { $("setup").hidden = false; $("status").textContent = "Waiting for the gist id."; render(); return; }
    $("setup").hidden = true;
    $("status").textContent = "Loading…";
    try {
      const r = await fetch(`https://api.github.com/gists/${encodeURIComponent(id)}?t=${Date.now()}`, { headers: { Accept: "application/vnd.github+json" } });
      if (!r.ok) throw new Error(r.status === 404 ? "gist not found: check the id" : `GitHub answered ${r.status}`);
      const g = await r.json();
      const f = g.files && g.files["diary.json"];
      if (!f) throw new Error("the gist has no diary.json yet; wait for the PC to send it");
      data = JSON.parse(f.content);
      store.set("cache", JSON.stringify(data));
      $("status").textContent = `Updated ${new Date(data.updated).toLocaleString()}`;
      checkAlerts();
    } catch (e) {
      const cached = store.get("cache");
      if (cached && !data) data = JSON.parse(cached);
      $("status").textContent = (data ? "Showing the last copy. " : "") + `Could not load: ${e.message}`;
    }
    render();
  }

  for (const k of VIEWS) {
    $(`tab-${k}`).addEventListener("click", () => {
      view = k; store.set("view", k);
      for (const j of VIEWS) $(`tab-${j}`).setAttribute("aria-selected", j === k ? "true" : "false");
      render();
    });
  }
  $("save").addEventListener("click", () => {
    const v = $("gist").value.trim().split("/").pop();
    if (!v) return;
    store.set("gist", v);
    load();
  });
  $("gist").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });
  $("prev").addEventListener("click", () => { monthOffset -= 1; render(); });
  $("next").addEventListener("click", () => { if (monthOffset < 0) { monthOffset += 1; render(); } });
  $("refresh").addEventListener("click", load);
  $("change").addEventListener("click", () => { $("setup").hidden = false; $("gist").value = store.get("gist") || ""; $("gist").focus(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  // installable app: the browser offers it once the worker and manifest are in place; we surface the prompt as a button
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  let installEvent = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; $("install").hidden = false; });
  $("install-btn").addEventListener("click", async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice.catch(() => {});
    installEvent = null; $("install").hidden = true;
  });
  window.addEventListener("appinstalled", () => { $("install").hidden = true; });

  paintAlerts();
  const savedView = store.get("view");
  if (savedView && VIEWS.includes(savedView)) $(`tab-${savedView}`).click();
  load();
})();
</script>
</body>
</html>
